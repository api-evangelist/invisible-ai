aid: invisible-ai
name: Invisible AI
description: 'Invisible AI is a next-generation computer vision company delivering a Vision Execution
  System (VES) for manufacturing. NVIDIA Jetson-powered edge devices with Intel RealSense 3D depth
  cameras and on-device SSD storage mount to existing factory infrastructure and, within hours,
  encode and segment the production floor in real time. The no-code, edge-based platform captures
  100% of production cycles across every station without wearables, operator disruption, or cloud
  integration, then analyzes human motion and objects to surface cycle-time variability, process
  drift, quality escapes, and safety/ergonomics risk. Founded in 2018 by autonomous-vehicle veterans
  and backed by Sierra Ventures, it serves automotive and aerospace OEMs including Toyota, Ford,
  General Motors, BMW, Mercedes-Benz, and Nissan. Invisible AI publishes no public API or developer
  platform today; this profile captures its company identity, security posture, and public web
  surface for the API Evangelist network.'
